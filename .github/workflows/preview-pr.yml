name: Preview PR

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

# Only one preview deployment per PR at a time.
# If a new /preview comment is posted while a run is in progress, cancel the older run.
# The group key resolves the same way whether the triggering event is an issue_comment
# (/preview) or a pull_request (closed, for cleanup) so the two coordinate correctly.
concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Run only if it's a /preview comment on a pull request (not an issue).
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/preview')

    steps:
      # ── Resolve PR number ─────────────────────────────────────────────────────
      - name: Resolve PR number
        shell: bash
        run: |
          PR_NUM="${{ github.event.issue.number }}"
          # Validate PR number is numeric
          if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "Error: Invalid PR number: $PR_NUM"
            exit 1
          fi
          echo "PR_NUMBER=$PR_NUM" >> $GITHUB_ENV
          echo "Resolved PR_NUMBER=$PR_NUM"

      # ── Post "build in progress" comment ──────────────────────────────────────
      # Creates a comment immediately so reviewers know a deployment has started.
      # The comment ID is captured so it can be updated on success or failure.
      - name: Comment PR with preview starting
        id: start_comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `⏳ **Preview build in progress...**\n\n🔗 [View workflow run](${runUrl})`;
            const { data: comment } = await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
            core.setOutput('comment_id', comment.id);

      # ── Validate mergeability ─────────────────────────────────────────────────
      # Prevent stale previews by ensuring the PR is mergeable before building.
      # Fails fast if the PR has conflicts or if GitHub hasn't yet computed mergeability.
      - name: Validate PR mergeability
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const state = String(pull.mergeable_state || '').toLowerCase();

            if (state === 'unknown' || pull.mergeable === null) {
              throw new Error('Mergeability not ready; rerun /preview shortly.');
            }
            if (state === 'dirty' || pull.mergeable === false) {
              throw new Error('PR has conflicts with base; update/rebase before /preview.');
            }

      # ── Checkout ──────────────────────────────────────────────────────────────
      # Check out the PR merge commit (PR branch merged with the base branch).
      - name: Checkout PR (merge ref)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/merge

      # ── Setup ─────────────────────────────────────────────────────────────────
      # Todowai's app lives under app/ (Vite + TypeScript), so only Node.js is needed.
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Surge CLI
        run: npm install -g surge

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build

      # ── Validate ──────────────────────────────────────────────────────────────
      # Check SURGE_TOKEN after checkout so the workspace is available for diagnostics.
      - name: Check SURGE_TOKEN
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "❌ ERROR: SURGE_TOKEN is not set!"
            echo ""
            echo "SURGE_TOKEN is mandatory to deploy to surge.sh with an account."
            echo ""
            echo "To generate a token:"
            echo "  1. Install surge: npm install -g surge"
            echo "  2. Login: surge login"
            echo "  3. Generate token: surge token"
            echo ""
            echo "Then add the token as a secret in GitHub Actions settings:"
            echo "  Repository Settings > Secrets and variables > Actions > New repository secret"
            echo "  Name: SURGE_TOKEN"
            echo "  Value: <your token from 'surge token' command>"
            echo ""
            exit 1
          fi
          echo "✓ SURGE_TOKEN is set"

      # ── Deploy ────────────────────────────────────────────────────────────────
      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          set -euo pipefail
          export DEPLOY_DOMAIN="pr-${{ env.PR_NUMBER }}-todowai-preview.surge.sh"
          surge ./app/dist --domain "$DEPLOY_DOMAIN" --token "$SURGE_TOKEN"
          echo "DEPLOY_URL=https://$DEPLOY_DOMAIN" >> $GITHUB_ENV

      # ── PR Feedback ───────────────────────────────────────────────────────────
      # Update the "in progress" comment with the result instead of creating a new one.
      - name: Update PR comment with preview link
        if: success()
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.start_comment.outputs.comment_id }}
          PREVIEW_URL: ${{ env.DEPLOY_URL }}
        with:
          script: |
            const commentId = Number(process.env.COMMENT_ID);
            const previewUrl = process.env.PREVIEW_URL || 'unavailable';
            const body = `🚀 **Preview deployed successfully!**\n\n🌐 Preview: [${previewUrl}](${previewUrl})`;
            await github.rest.issues.updateComment({
              comment_id: commentId,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Update PR comment on failure
        if: failure() && steps.start_comment.outputs.comment_id
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.start_comment.outputs.comment_id }}
        with:
          script: |
            const commentId = Number(process.env.COMMENT_ID);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `❌ **Preview build failed.**\n\n🔗 [View workflow run](${runUrl})`;
            await github.rest.issues.updateComment({
              comment_id: commentId,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ── Backend preview image (issue #66) ───────────────────────────────────────
  # Builds and pushes a per-PR Docker image (backend + bundled web UI, see #59) to GHCR
  # so a reviewer can exercise the real backend/git/sync behavior, not just the UI shell
  # that the Surge preview above covers. Posts its own tracking comment, separate from
  # Surge's, so the two builds (independent speeds/failure modes) don't race to edit the
  # same comment.
  docker-preview:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/preview')
    permissions:
      contents: read
      pull-requests: write
      packages: write

    steps:
      - name: Resolve PR number
        shell: bash
        run: |
          PR_NUM="${{ github.event.issue.number }}"
          if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "Error: Invalid PR number: $PR_NUM"
            exit 1
          fi
          echo "PR_NUMBER=$PR_NUM" >> $GITHUB_ENV

      - name: Compute lowercase image name
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Comment PR with backend preview build starting
        id: start_comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `⏳ **Backend preview image build in progress...**\n\n🔗 [View workflow run](${runUrl})`;
            const { data: comment } = await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
            core.setOutput('comment_id', comment.id);

      - name: Validate PR mergeability
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const state = String(pull.mergeable_state || '').toLowerCase();

            if (state === 'unknown' || pull.mergeable === null) {
              throw new Error('Mergeability not ready; rerun /preview shortly.');
            }
            if (state === 'dirty' || pull.mergeable === false) {
              throw new Error('PR has conflicts with base; update/rebase before /preview.');
            }

      - name: Checkout PR (merge ref)
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/merge

      # Building this multi-stage image (Rust compilation is the heavy part) can exceed the
      # runner's default free disk space once combined with cache export, surfacing as a
      # BuildKit "failed to reserve cache" error rather than a clear disk-space message.
      # Freeing space taken by preinstalled toolchains this workflow doesn't use gives enough
      # headroom.
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          docker-images: false
          large-packages: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No cache-from/cache-to here: the type=gha cache backend failed twice in a row with
      # "error writing layer blob: failed to reserve cache" during the separate "exporting to
      # GitHub Actions Cache" step — notably *after* the image itself had already built and
      # pushed successfully. That's a known flaky spot for buildx's GHA cache backend on larger
      # builds; a registry-based cache (type=registry) would be the next thing to try if build
      # time becomes a real problem, but a plain uncached build that reliably succeeds beats a
      # faster one that fails on its own optimization step.
      - name: Build and push per-PR preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:pr-${{ env.PR_NUMBER }}

      - name: Update PR comment with docker run command
        if: success()
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.start_comment.outputs.comment_id }}
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:pr-${{ env.PR_NUMBER }}
        with:
          script: |
            const commentId = Number(process.env.COMMENT_ID);
            const image = process.env.IMAGE_TAG;
            const body = [
              '🐳 **Backend preview image published!**',
              '',
              'Run it locally against a test vault (a real git repo folder) to exercise the actual backend, not just the UI:',
              '```bash',
              `docker run -p 8080:8080 -v /path/to/your/vault:/vault ${image}`,
              '```',
              'Then open http://localhost:8080.'
            ].join('\n');
            await github.rest.issues.updateComment({
              comment_id: commentId,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Update PR comment on failure
        if: failure() && steps.start_comment.outputs.comment_id
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.start_comment.outputs.comment_id }}
        with:
          script: |
            const commentId = Number(process.env.COMMENT_ID);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `❌ **Backend preview image build failed.**\n\n🔗 [View workflow run](${runUrl})`;
            await github.rest.issues.updateComment({
              comment_id: commentId,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ── Cleanup (issue #66) ──────────────────────────────────────────────────────
  # Removes the per-PR image tag from GHCR once the PR closes (merged or not), so
  # preview images don't accumulate indefinitely.
  cleanup-preview-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      packages: write

    steps:
      - name: Delete per-PR preview image tag from GHCR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const tag = `pr-${prNumber}`;
            const packageName = context.repo.repo;
            const owner = context.repo.owner;

            // GHCR container packages for this repo are owned by the `sunix` user account
            // (confirmed via the API), not an org — hence the *ForUser endpoints below.
            let versions;
            try {
              versions = await github.paginate(
                github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                { package_type: 'container', package_name: packageName, username: owner }
              );
            } catch (error) {
              if (error.status === 404) {
                // No preview image has ever been published (e.g. this PR never got a
                // /preview comment, or this is the very first one for the repo) — the
                // package itself doesn't exist yet, which 404s here rather than returning
                // an empty list.
                console.log(`Package ${packageName} not found; nothing to clean up.`);
                return;
              }
              throw error;
            }

            const match = versions.find((version) =>
              (version.metadata?.container?.tags || []).includes(tag)
            );

            if (!match) {
              console.log(`No preview image tagged ${tag} found; nothing to clean up.`);
              return;
            }

            await github.rest.packages.deletePackageVersionForUser({
              package_type: 'container',
              package_name: packageName,
              username: owner,
              package_version_id: match.id,
            });
            console.log(`Deleted preview image ${tag} (version id ${match.id}).`);
